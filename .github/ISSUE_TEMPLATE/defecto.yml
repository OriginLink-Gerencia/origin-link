name: Defecto
description: Error encontrado en pruebas (lo cierra quien lo reportó, no quien lo corrigió)
title: "BUG: "
labels: ["defecto"]
body:
  - type: input
    id: historia
    attributes:
      label: Historia afectada
      description: "Ej.: #12 HU-03 Publicar lote"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado vs. obtenido
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: ["Bloqueante", "Crítico", "Mayor", "Menor"]
    validations:
      required: true
